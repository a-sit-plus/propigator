name: Spotless Check

on:
  #For caching
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      kotlin-version:
        description: 'Override Kotlin version?'
        required: false
        default: ''
        type: string
      testballoon-version:
        description: 'Override TestBalloon version (full version string)?'
        required: false
        default: ''
        type: string

jobs:
  spotlessCheck:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Common Setup
        uses: a-sit-plus/internal-workflows/.github/actions/common-setup@v2
        with:
          override-cache: ${{ github.ref_name == 'main' }}
      - name: check
        run: ./gradlew spotlessCheck